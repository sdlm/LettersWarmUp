<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алфавит</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="toggle-row">
    <button type="button" id="alphabet-ru" class="alphabet-toggle" aria-pressed="false">RU</button>
    <button type="button" id="alphabet-en" class="alphabet-toggle" aria-pressed="false">EN</button>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Переключить тему"></button>
  </div>

  <main class="letter-area">
    <div id="letter" class="letter"></div>
    <div id="timer" class="timer"></div>
  </main>

  <div class="button-row">
    <button type="button" id="know-button" class="answer-button">Знаю</button>
    <button type="button" id="dont-know-button" class="answer-button">Не знаю</button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
