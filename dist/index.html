<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Алфавит</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Алфавит">
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #767676;
  --button-bg: #f0f0f0;
}

[data-theme="dark"] {
  --bg: #0b0b0b;
  --fg: #f2f2f2;
  --muted: #7a7a7a;
  --button-bg: #1e1e1e;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100%;    /* pre-15.4 Safari: resolves through html/body */
  height: 100dvh;  /* modern: tracks the collapsing toolbar */
  padding: 12px
           calc(16px + env(safe-area-inset-right))
           calc(12px + env(safe-area-inset-bottom))
           calc(16px + env(safe-area-inset-left));
}

.toggle-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
}

.alphabet-toggle,
.theme-toggle {
  appearance: none;
  border: none;
  background: none;
  padding: 4px;
  margin: 0;
  color: var(--muted);
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  touch-action: manipulation;
}

.alphabet-toggle.active {
  color: var(--fg);
}

.theme-toggle {
  margin-left: auto;
  font-size: 20px;
}

.letter-area {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.letter {
  font-size: min(40vh, 55vw);   /* fallback for pre-15.4 Safari */
  font-size: min(40dvh, 55vw);
  line-height: 1;
  animation: fade-in 150ms ease-out;
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.timer {
  font-size: 20px;
  color: var(--muted);
  margin-top: 8px;
}

.hint {
  font-size: 20px;
  color: var(--muted);
  visibility: hidden;
}

/* Keeps the line height when the hint text is empty, so the letter never moves. */
.hint:empty::before {
  content: "\00a0";
}

.button-row {
  display: flex;
  gap: 12px;
  flex: 0 0 auto;
}

.answer-button {
  flex: 1 1 0;
  min-height: 72px;
  border: none;
  border-radius: 12px;
  background: var(--button-bg);
  color: var(--fg);
  font-family: inherit;
  font-size: 20px;
  font-weight: 600;
  touch-action: manipulation;
}

</style>
</head>
<body>
<div class="app">
  <div class="toggle-row">
    <button type="button" id="alphabet-ru" class="alphabet-toggle" aria-pressed="false">RU</button>
    <button type="button" id="alphabet-en" class="alphabet-toggle" aria-pressed="false">EN</button>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Переключить тему"></button>
  </div>

  <main class="letter-area">
    <div id="letter" class="letter"></div>
    <div id="timer" class="timer"></div>
    <div id="nato" class="hint"></div>
    <div id="kid" class="hint"></div>
  </main>

  <div class="button-row">
    <button type="button" id="know-button" class="answer-button">Знаю</button>
    <button type="button" id="dont-know-button" class="answer-button">Не знаю</button>
  </div>
</div>
<script>
const ALPHABETS = {
  ru: "АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split(""),  // 32 letters, no Ё
  en: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),        // 26 letters
};

const HINTS = {
  en: {
    A: { nato: "Alfa",     kid: "apple" },
    B: { nato: "Bravo",    kid: "banana" },
    C: { nato: "Charlie",  kid: "carrot" },
    D: { nato: "Delta",    kid: "doughnut" },
    E: { nato: "Echo",     kid: "egg" },
    F: { nato: "Foxtrot",  kid: "frog" },
    G: { nato: "Golf",     kid: "grape" },
    H: { nato: "Hotel",    kid: "honey" },
    I: { nato: "India",    kid: "ice cream" },
    J: { nato: "Juliett",  kid: "juice" },
    K: { nato: "Kilo",     kid: "kiwi" },
    L: { nato: "Lima",     kid: "lemon" },
    M: { nato: "Mike",     kid: "mango" },
    N: { nato: "November", kid: "nut" },
    O: { nato: "Oscar",    kid: "orange" },
    P: { nato: "Papa",     kid: "potato" },
    Q: { nato: "Quebec",   kid: "queen" },
    R: { nato: "Romeo",    kid: "rabbit" },
    S: { nato: "Sierra",   kid: "strawberry" },
    T: { nato: "Tango",    kid: "tomato" },
    U: { nato: "Uniform",  kid: "umbrella" },
    V: { nato: "Victor",   kid: "volcano" },
    W: { nato: "Whiskey",  kid: "watermelon" },
    X: { nato: "X-ray",    kid: "x-ray" },
    Y: { nato: "Yankee",   kid: "yogurt" },
    Z: { nato: "Zulu",     kid: "zebra" },
  },
};
// Picks the next letter to practice. Each letter gets a weight w = t * k:
//   t = seconds since the letter was last closed (0 if it was just shown)
//   k = difficulty multiplier (2 if the child didn't know it, 0.5 if they did)
// Probability of a letter is w / sum(w). No DOM, no clock, no storage:
// `nowMs` and `rng` are injected so this module is deterministic under test.

function createSession() {
  return { history: {}, lastShown: null };
}

function recordAnswer(state, letter, answer, nowMs) {
  state.history[letter] = { answer, closedAt: nowMs };
  state.lastShown = letter;
}

function computeWeights(state, letters, nowMs) {
  return letters.map((letter) => {
    if (letter === state.lastShown) {
      return { letter, t: 0, k: 1, w: 0 };
    }
    const entry = state.history[letter];
    if (!entry) {
      // Unseen letter: treat it as if it had been idle five minutes.
      const t = 5 * 60;
      return { letter, t, k: 1, w: t };
    }
    // Clamp at 0: a clock that has moved backwards (NTP correction, a
    // child in the date settings) must never produce a negative weight.
    const t = Math.max(0, (nowMs - entry.closedAt) / 1000);
    // Anything other than "dont_know" (i.e. "know") is treated as known.
    const k = entry.answer === "dont_know" ? 2 : 0.5;
    return { letter, t, k, w: t * k };
  });
}

function pickNext(state, letters, nowMs, rng) {
  const weights = computeWeights(state, letters, nowMs);
  const total = weights.reduce((sum, x) => sum + x.w, 0);

  if (total === 0) {
    const index = Math.floor(rng() * letters.length);
    return letters[index];
  }

  const r = rng() * total;
  let running = 0;
  let lastNonZero = null;
  for (const x of weights) {
    if (x.w > 0) {
      lastNonZero = x.letter;
    }
    running += x.w;
    if (running > r) {
      return x.letter;
    }
  }
  return lastNonZero;
}

const TIMER_SECONDS = 5;
const TIMER_TICK_MS = 250;
// Mirrors --bg in styles.css; used for the system bar of the installed app.
const THEME_COLORS = { light: "#ffffff", dark: "#0b0b0b" };

const sessions = {};
let currentAlphabet = "ru";
let currentTheme = "light";
let currentLetter = null;
let timerStartedAt = 0;

let elements = null;

function readStorage(key, allowedValues, fallback) {
  try {
    const value = localStorage.getItem(key);
    if (allowedValues.includes(value)) {
      return value;
    }
  } catch (err) {
    // localStorage unavailable (e.g. private mode) — use fallback.
  }
  return fallback;
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (err) {
    // localStorage unavailable (e.g. private mode) — ignore.
  }
}

function getSession(alphabet) {
  if (!sessions[alphabet]) {
    sessions[alphabet] = createSession();
  }
  return sessions[alphabet];
}

function requireElement(id) {
  const el = document.getElementById(id);
  if (!el) {
    throw new Error(`LettersWarmUp: missing required element #${id}`);
  }
  return el;
}

function collectElements() {
  return {
    alphabetRu: requireElement("alphabet-ru"),
    alphabetEn: requireElement("alphabet-en"),
    themeToggle: requireElement("theme-toggle"),
    letter: requireElement("letter"),
    timer: requireElement("timer"),
    nato: requireElement("nato"),
    kid: requireElement("kid"),
    knowButton: requireElement("know-button"),
    dontKnowButton: requireElement("dont-know-button"),
  };
}

function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  elements.themeToggle.textContent = theme === "dark" ? "☾" : "☼";
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  if (themeColorMeta) {
    themeColorMeta.setAttribute("content", THEME_COLORS[theme]);
  }
}

function applyAlphabetToggle(alphabet) {
  const isRu = alphabet === "ru";
  const isEn = alphabet === "en";
  elements.alphabetRu.classList.toggle("active", isRu);
  elements.alphabetRu.setAttribute("aria-pressed", String(isRu));
  elements.alphabetEn.classList.toggle("active", isEn);
  elements.alphabetEn.setAttribute("aria-pressed", String(isEn));
}

function showNextLetter() {
  const session = getSession(currentAlphabet);
  const letters = ALPHABETS[currentAlphabet];
  currentLetter = pickNext(session, letters, Date.now(), Math.random);

  const letterEl = elements.letter;
  letterEl.textContent = currentLetter;
  letterEl.style.animation = "none";
  // Force reflow so the animation restarts.
  void letterEl.offsetWidth;
  letterEl.style.animation = "";

  const hint = currentHint();
  elements.nato.textContent = hint ? hint.nato : "";
  elements.kid.textContent = hint ? hint.kid : "";
  setHintsVisible(false);
  restartTimer();
}

function currentHint() {
  return HINTS[currentAlphabet]?.[currentLetter] ?? null;
}

function setHintsVisible(visible) {
  const visibility = visible ? "visible" : "hidden";
  elements.nato.style.visibility = visibility;
  elements.kid.style.visibility = visibility;
}

function restartTimer() {
  timerStartedAt = Date.now();
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const timerEl = elements.timer;
  const elapsedSeconds = (Date.now() - timerStartedAt) / 1000;
  const remaining = Math.min(TIMER_SECONDS, Math.ceil(TIMER_SECONDS - elapsedSeconds));

  if (remaining <= 0) {
    timerEl.style.visibility = "hidden";
    setHintsVisible(currentHint() !== null);
  } else {
    timerEl.style.visibility = "visible";
    timerEl.textContent = String(remaining);
    setHintsVisible(false);
  }
}

function handleAnswer(answer) {
  const session = getSession(currentAlphabet);
  recordAnswer(session, currentLetter, answer, Date.now());
  showNextLetter();
}

function switchAlphabet(alphabet) {
  if (alphabet === currentAlphabet) {
    return;
  }
  currentAlphabet = alphabet;
  writeStorage("lw.alphabet", alphabet);
  applyAlphabetToggle(alphabet);
  showNextLetter();
}

function toggleTheme() {
  const nextTheme = currentTheme === "light" ? "dark" : "light";
  currentTheme = nextTheme;
  writeStorage("lw.theme", nextTheme);
  applyTheme(nextTheme);
}

function registerServiceWorker() {
  // Over file:// there is nothing to register; the single-file app works as is.
  const servedOverHttp = location.protocol === "http:" || location.protocol === "https:";
  if (!servedOverHttp || !("serviceWorker" in navigator)) {
    return;
  }
  navigator.serviceWorker.register("sw.js").catch(() => {
    // Offline support is a bonus; the app works without it.
  });
}

function keepScreenAwake() {
  if (!("wakeLock" in navigator)) {
    return;
  }
  const acquire = () => {
    if (document.visibilityState !== "visible") {
      return;
    }
    navigator.wakeLock.request("screen").catch(() => {
      // Denied (low battery, insecure context, policy) — the screen may dim.
    });
  };
  // The browser drops the lock whenever the page is hidden; take it again on return.
  document.addEventListener("visibilitychange", acquire);
  acquire();
}

function init() {
  elements = collectElements();

  currentAlphabet = readStorage("lw.alphabet", ["ru", "en"], "ru");
  currentTheme = readStorage("lw.theme", ["light", "dark"], "light");

  applyTheme(currentTheme);
  applyAlphabetToggle(currentAlphabet);

  elements.alphabetRu.addEventListener("click", () => switchAlphabet("ru"));
  elements.alphabetEn.addEventListener("click", () => switchAlphabet("en"));
  elements.themeToggle.addEventListener("click", toggleTheme);
  elements.knowButton.addEventListener("click", () => handleAnswer("know"));
  elements.dontKnowButton.addEventListener("click", () => handleAnswer("dont_know"));

  showNextLetter();
  setInterval(updateTimerDisplay, TIMER_TICK_MS);

  registerServiceWorker();
  keepScreenAwake();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
</body>
</html>
